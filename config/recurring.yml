production:
  clear_solid_queue_finished_jobs:
    command: 'SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)'
    priority: 50
    schedule: every hour at minute 12
  competition_publishing_reminder_job:
    class: 'Competitions::Publishing::ReminderJob'
    priority: 40
    schedule: 0 10 * * tue
  new_competition_mailing_job:
    class: NewCompetitionMailingJob
    priority: 40
    schedule: 12 7 * * *
  competition_auto_deletion:
    class: 'Competitions::AutoDeletion::Job'
    priority: 50
    schedule: 7 4 * * *
  invitation_cleanup:
    class: 'InvitationValidity::CleanupJob'
    priority: 50
    schedule: 37 4 * * *
  import_suggestions:
    class: ImportSuggestionsJob
    priority: 50
    schedule: 21 5 * * *
  solid_queue_debug:
    class: DebugJob
    priority: 10
    schedule: '*/20 * * * *'
  snapshot_reminder_job:
    class: 'Snapshot::ReminderJob'
    priority: 40
    schedule: '*/15 8-16 * * *'
